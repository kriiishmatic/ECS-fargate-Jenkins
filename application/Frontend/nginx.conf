
user nginx;
worker_processes auto;

error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    resolver 169.254.169.253 valid=10s;
    resolver_timeout 5s;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    keepalive_timeout 65;
    types_hash_max_size 4096;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;

    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "OK\n";
        }

        # Catalogue
        location /api/catalogue/ {
            set $catalogue catalogue.internal;
            rewrite ^/api/catalogue/(.*)$ /$1 break;
            proxy_pass http://$catalogue:8080;
        }

        # User
        location /api/user/ {
            set $user user.internal;
            rewrite ^/api/user/(.*)$ /$1 break;
            proxy_pass http://$user:8080;
        }

        # Cart
        location /api/cart/ {
            set $cart cart.internal;
            rewrite ^/api/cart/(.*)$ /$1 break;
            proxy_pass http://$cart:8080;
        }

        # Shipping
        location /api/shipping/ {
            set $shipping shipping.internal;
            rewrite ^/api/shipping/(.*)$ /$1 break;
            proxy_pass http://$shipping:8080;
        }

        # Payment
        location /api/payment/ {
            set $payment payment.internal;
            rewrite ^/api/payment/(.*)$ /$1 break;
            proxy_pass http://$payment:8080;
        }

        # Static images
        location /images/ {
            expires 5s;
            try_files $uri /images/placeholder.jpg;
        }

        # React SPA fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
